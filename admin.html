<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Admin Panel – Live Control</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            background: #02090c;
            color: #fff;
            font-family: Poppins, sans-serif;
            display: flex;
            justify-content: center;
        }

        .android {
            width: 100%;
            max-width: 430px;
            padding: 20px;
        }

        h2,
        h3 {
            text-align: center;
            font-family: Orbitron;
        }

        h2 {
            color: #00f5ff;
            text-shadow: 0 0 15px #00f5ff;
            margin-bottom: 20px;
        }

        h3 {
            color: #ff2fa6;
            margin-top: 25px;
            text-shadow: 0 0 10px #ff2fa6;
        }

        .box {
            background: rgba(255, 255, 255, 0.06);
            padding: 18px;
            border-radius: 15px;
            margin-top: 10px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.15);
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            background: rgba(255, 255, 255, 0.08);
            border: none;
            border-radius: 10px;
            color: white;
            outline: none;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            border: none;
            font-weight: bold;
            font-size: 16px;
            border-radius: 12px;
            color: #003840;
            cursor: pointer;
            background: linear-gradient(135deg, #00f5ff, #00ff99);
            box-shadow: 0 0 15px rgba(0, 255, 200, 0.4);
        }

        .line {
            height: 1px;
            background: rgba(255, 255, 255, 0.15);
            margin: 25px 0;
        }
    </style>

</head>

<body>

    <div class="android">

        <script>
            if (prompt("Enter Admin Password") !== "admin123") {
                alert("Wrong Password!");
                location.href = "index.html";
            }
        </script>

        <h2>🏸 ADMIN CONTROL PANEL</h2>

        <!-- Live Score Box -->
        <div class="box">
            <h3>Live Score Update</h3>
            <input id="t1" placeholder="Team 1 Name">
            <input id="t2" placeholder="Team 2 Name">
            <input id="s1" type="number" placeholder="Score 1">
            <input id="s2" type="number" placeholder="Score 2">
            <button onclick="updateScore()">UPDATE LIVE SCORE</button>
            <button onclick="finishMatch()" style="background:#ff2fa6;">FINISH MATCH</button>
        </div>

        <div class="line"></div>

        <!-- Next Match Box -->
        <div class="box">
            <h3>Next Match</h3>
            <input id="nt1" placeholder="Next Match Team 1">
            <input id="nt2" placeholder="Next Match Team 2">
            <button onclick="updateNext()">UPDATE NEXT MATCH</button>
        </div>

        <div class="line"></div>

        <!-- TEAM ADD BOX -->
        <div class="box">
            <h3>Add Team</h3>
            <input id="newTeam" placeholder="Enter Team Name">
            <button onclick="addTeam()">ADD TEAM</button>
        </div>

        <script type="module">
            import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
            import { getDatabase, ref, set, push } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-database.js";

            const firebaseConfig = {
                apiKey: "AIzaSyBsryK9TnDhtqLoeM5ZEWhSA31v29Dz5tk",
                authDomain: "live-score-1dc40.firebaseapp.com",
                databaseURL: "https://live-score-1dc40-default-rtdb.asia-southeast1.firebasedatabase.app",
                projectId: "live-score-1dc40",
                storageBucket: "live-score-1dc40.firebasestorage.app",
                messagingSenderId: "24992738262",
                appId: "1:24992738262:web:7521ab00008c2b8156d277"
            };

            const app = initializeApp(firebaseConfig);
            const db = getDatabase(app);

            /* 1️⃣ UPDATE LIVE SCORE */
            window.updateScore = () => {
                set(ref(db, "liveMatch"), {
                    team1: t1.value,
                    team2: t2.value,
                    score1: Number(s1.value),
                    score2: Number(s2.value)
                });
                alert("Live Score Updated!");
            };

            /* 2️⃣ UPDATE NEXT MATCH */
            window.updateNext = () => {
                set(ref(db, "nextMatch"), {
                    team1: nt1.value,
                    team2: nt2.value
                });
                alert("Next Match Updated!");
            };

            /* 3️⃣ FINISH MATCH → ADD TO HISTORY + RESET */
            window.finishMatch = () => {

                let data = {
                    team1: t1.value,
                    team2: t2.value,
                    score1: Number(s1.value),
                    score2: Number(s2.value),
                    time: new Date().toLocaleString()
                };

                push(ref(db, "history"), data);   //save history

                set(ref(db, "liveMatch"), {         //reset
                    team1: "Waiting",
                    team2: "",
                    score1: 0,
                    score2: 0
                });

                t1.value = ""; t2.value = "";
                s1.value = ""; s2.value = "";

                alert("Match Finished & Saved!");
            };

            /* 4️⃣ ADD TEAM */
            window.addTeam = () => {
                if (newTeam.value.trim() === "") {
                    alert("Enter team name!");
                    return;
                }
                push(ref(db, "teams"), {
                    name: newTeam.value
                });
                alert("Team Added!");
                newTeam.value = "";
            };
        </script>

    </div>
</body>

</html>
